kind = "web"
previewPath = "/"
title = "Deux Voir"
description = "An editorial research publishing website and private single-admin CMS for Deux Voir, with database-backed papers, public paper pages, and Cloudinary image uploads."
version = "1.0.0"
id = "artifacts/frontend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20713

[services.development]
run = "pnpm --filter @workspace/frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frontend", "run", "build" ]
serve = "static"
publicDir = "artifacts/frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20713"
BASE_PATH = "/"
